<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Music · Homesick</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="styles/base.css" />
    <style>
      body {
        background: #0e1624;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #frame {
        flex: 1;
        display: flex;
      }
      #frame iframe {
        border: 0;
        width: 100%;
        height: 100%;
        border-radius: 12px;
      }
      .empty {
        margin: auto;
        padding: 24px;
        text-align: center;
        font-size: 14px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="frame"></div>
    <div class="bar">
      <span class="muted" id="label"></span>
      <button class="link-btn" id="back">Put it back in the new tab</button>
    </div>
    <script type="module" src="player.js"></script>
  </body>
</html>
